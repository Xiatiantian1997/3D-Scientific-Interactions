<div class="eyebrow">CVD / 设备解剖</div>
<h2>把炉管打开，沿结构看原理</h2>
<div class="stage"><div class="pose">水平热壁 LPCVD · 教学模型</div><canvas role="img" aria-label="可旋转的三维炉管模型。依次抬起外层炉壳与保温层、上半石英管，移开端盖并抽出晶舟。"></canvas><div class="bottom"><span>图内旋转、缩放 · 图外翻页</span><span class="view-label">内部观察</span></div></div>
<div class="controls"><button class="tour">播放拆解</button><button class="assemble">合拢</button><button class="reset">复位视角</button><button class="rotate" aria-label="向左转动物体">左转</button><button class="rotate-right" aria-label="向右转动物体">右转</button><button class="zoom-in" aria-label="放大结构">＋</button><button class="zoom-out" aria-label="缩小结构">−</button></div>
<div class="bar"><label for="cvd-explode">逐层展开</label><span class="step-label">炉壳已抬起</span></div><input id="cvd-explode" type="range" min="0" max="1000" value="520">
<div class="parts" aria-label="选择结构"><button data-part="shell">炉壳与加热</button><button data-part="tube">石英反应管</button><button data-part="boat" aria-pressed="true">晶舟与晶圆</button><button data-part="gas">进气端</button><button data-part="outlet">抽气端</button></div>
<div class="info" aria-live="polite"><strong>晶舟与晶圆</strong><p>一批晶圆竖着排在晶舟上。间隔让气体进入各片之间；晶舟负责支撑，不负责产生等离子体。</p></div>
<div class="note">剖开与展开是观察手段，不是实际开炉顺序。比例、片数、法兰与附件经过简化；未画全部气柜、联锁、真空泵及尾气处理。颜色区分部件，不表示温度。无需下载，也不依赖外部三维库。</div>
<script>
(()=>{
const root=document.getElementById('cvd-structure-3d'),q=s=>root.querySelector(s),canvas=q('canvas'),gl=canvas.getContext('webgl',{alpha:true,antialias:true}),ctx=gl?null:canvas.getContext('2d');
const C={base:[169,175,169],foot:[91,106,105],metal:[181,193,191],edge:[142,158,156],shell:[201,198,180],inner:[219,209,184],coil:[164,125,77],quartz:[174,196,195],wafer:[66,116,125],boat:[206,215,201],dark:[64,81,84],gas:[128,151,153]};

const TOUR_SECONDS=6;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const info={shell:['炉壳、保温层与加热区','从外到内是支撑外壳、保温材料和电阻加热区。它们包围石英管，把热量传入管内；本模型分三段表示加热区，不表示具体厂商配置。'],tube:['石英反应管','气体在这根管内接触晶圆。这里把管子沿轴向剖成上下两半，方便看内部；实际石英管通常不是这样打开的。热壁上也可能沉积，清洁状态会影响颗粒风险。'],boat:['晶舟与晶圆','一批晶圆竖着排在晶舟上。间隔让气体进入各片之间；晶舟负责支撑，不负责产生等离子体。蓝灰色圆片是晶圆，并非气流挡板。'],gas:['进气端与密封端盖','反应气经进气接口进入管内；上游的流量控制器决定进气量。端盖与密封接口把腔体同外部环境隔开。展开时接口被分离，仅表示装配关系。'],outlet:['抽气端与压力测量口','尾端连接下游节流阀和真空泵；上方细支管表示压力测量口。持续进气与持续抽气可以同时存在，低压不等于管内没有气体。']};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const phase=(p,a,b)=>clamp((p-a)/(b-a));
function offsets(p){return{hood:phase(p,0,.32)*3.2,tube:phase(p,.32,.58)*1.45,door:phase(p,.58,.77)*5.6,boat:phase(p,.77,1)*2.4}}
let faces=[];function face(v,col,group){faces.push({v,col,group})}
function box(x,y,z,w,d,h,col,group){let v=[[x,y,z],[x+w,y,z],[x+w,y+d,z],[x,y+d,z],[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]];for(let inds of [[0,3,2,1],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]])face(inds.map(i=>v[i]),col,group)}
function cylX(x0,x1,y,z,r,col,group,N=28){for(let i=0;i<N;i++){let a=i/N*2*Math.PI,b=(i+1)/N*2*Math.PI;let v=[[x0,y+r*Math.cos(a),z+r*Math.sin(a)],[x1,y+r*Math.cos(a),z+r*Math.sin(a)],[x1,y+r*Math.cos(b),z+r*Math.sin(b)],[x0,y+r*Math.cos(b),z+r*Math.sin(b)]];face(v,col,group);face([[x0,y,z],v[0],v[3]],col,group);face([[x1,y,z],v[2],v[1]],col,group)}}
function shell(x0,x1,y,z,ri,ro,a0,a1,col,group,N=24){for(let i=0;i<N;i++){let a=a0+(a1-a0)*i/N,b=a0+(a1-a0)*(i+1)/N;let at=(x,r,t)=>[x,y+r*Math.cos(t),z+r*Math.sin(t)];face([at(x0,ro,a),at(x1,ro,a),at(x1,ro,b),at(x0,ro,b)],col,group);face([at(x0,ri,b),at(x1,ri,b),at(x1,ri,a),at(x0,ri,a)],col,group);face([at(x0,ri,a),at(x0,ro,a),at(x0,ro,b),at(x0,ri,b)],col,group);face([at(x1,ri,b),at(x1,ro,b),at(x1,ro,a),at(x1,ri,a)],col,group)}for(let a of [a0,a1])face([[x0,y+ri*Math.cos(a),z+ri*Math.sin(a)],[x1,y+ri*Math.cos(a),z+ri*Math.sin(a)],[x1,y+ro*Math.cos(a),z+ro*Math.sin(a)],[x0,y+ro*Math.cos(a),z+ro*Math.sin(a)]],col,group)}
function rod(a,b,r,col,group,N=10){let v=b.map((x,i)=>x-a[i]),len=Math.hypot(...v);v=v.map(x=>x/len);let u=Math.abs(v[2])<.9?[-v[1],v[0],0]:[0,-v[2],v[1]],ul=Math.hypot(...u);u=u.map(x=>x/ul);let t=[v[1]*u[2]-v[2]*u[1],v[2]*u[0]-v[0]*u[2],v[0]*u[1]-v[1]*u[0]];for(let i=0;i<N;i++){let p=i/N*2*Math.PI,qq=(i+1)/N*2*Math.PI,f=(o,j)=>o.map((x,k)=>x+r*(u[k]*Math.cos(j)+t[k]*Math.sin(j)));face([f(a,p),f(b,p),f(b,qq),f(a,qq)],col,group);face([a,f(a,qq),f(a,p)],col,group);face([b,f(b,p),f(b,qq)],col,group)}}
function model(){faces=[];let o=offsets(progress),Z=2.1;
box(-5,-1.9,-.25,10,3.8,.35,C.base,'base');for(let x of [-4.55,4.15])for(let y of [-1.65,1.25])box(x,y,-.65,.4,.4,.4,C.foot,'base');
for(let x of [-3.15,2.8])box(x,-.45,.1,.4,.9,.2,C.metal,'base');
for(let n=0;n<3;n++){let a=-3.8+n*2.54,b=a+2.47;for(let upper of [false,true]){let z=Z+(upper?o.hood:0),lo=upper?0:Math.PI,hi=upper?Math.PI:2*Math.PI;shell(a,b,0,z,1.47,1.8,lo,hi,C.shell,'shell');shell(a+.06,b-.06,0,z,1.34,1.47,lo,hi,C.inner,'shell');for(let j=0;j<3;j++){let xx=a+.35+j*.8;shell(xx,xx+.055,0,z,1.31,1.34,lo,hi,C.coil,'shell',20)}}}
for(let upper of [false,true])shell(-4.16,4.16,0,Z+(upper?o.tube:0),1.18,1.24,upper?0:Math.PI,upper?Math.PI:2*Math.PI,C.quartz,'tube',28);
for(let end of [-1,1]){let x=end*4.28-(end<0?o.door:0),group=end<0?'gas':'outlet';shell(x-.12,x+.12,0,Z,.18,1.36,0,Math.PI*2,C.metal,group,32);
let outer=x+end*.12;shell(outer,outer+end*.65,0,Z,.12,.18,0,Math.PI*2,C.metal,group,16);shell(outer+end*.65,outer+end*.8,0,Z,.12,.29,0,Math.PI*2,C.edge,group,16);
if(end===1){rod([4.72,0,Z+.18],[4.72,0,Z+1.45],.09,C.metal,'outlet');box(4.47,-.25,Z+1.45,.5,.5,.45,C.dark,'outlet')}
}
let shift=-o.boat;
// Rails below the wafer rim; only the seven small saddles meet the circular edge.
for(let y of [-.5,.5])box(-2.8+shift,y-.07,Z-.96,5.6,.14,.14,C.boat,'boat');
for(let x of [-2.8,2.65])box(x+shift,-.57,Z-.96,.15,1.14,.14,C.boat,'boat');
for(let i=0;i<7;i++){let x=-2.4+i*.8+shift;cylX(x-.025,x+.025,0,Z,.9,C.wafer,'boat',32);
for(let y of [-.5,.5])box(x-.025,y-.025,Z-.82,.05,.05,.06,C.boat,'boat')}

return faces}
function project(v,w,h){let co=Math.cos(az),si=Math.sin(az),ce=Math.cos(el),se=Math.sin(el);let vx=v[0]+offsets(progress).door*.42;let x=co*vx-si*v[1],depth=si*vx+co*v[1],z=v[2]-2.25;let scale=Math.min(w/15.6,h/11.8)*zoom;return[w/2+x*scale,h*.55-(z*ce-depth*se)*scale,depth*ce+z*se]}
function rgb(col,k){return 'rgb('+col.map(v=>Math.round(clamp(v*k,0,255))).join(',')+')'}
let program,buffer,positionLocation,colorLocation;

function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
if(gl){program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec3 position; attribute vec3 color; varying vec3 tint; void main(){gl_Position=vec4(position,1.0);tint=color;}'));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float; varying vec3 tint; void main(){gl_FragColor=vec4(tint,1.0);}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error('Shader link failed');
positionLocation=gl.getAttribLocation(program,'position');colorLocation=gl.getAttribLocation(program,'color');buffer=gl.createBuffer();gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.clearColor(0,0,0,0);}
// Software depth buffer keeps the same front/back logic when WebGL is unavailable.
function rasterDepth(data,w,h){const img=ctx.createImageData(w,h),pixels=img.data,depth=new Float32Array(w*h);depth.fill(Infinity);
for(let k=0;k<data.length;k+=18){const vs=[0,6,12].map(o=>[(data[k+o]+1)*w/2,(1-data[k+o+1])*h/2,data[k+o+2]]),[a,b,c]=vs;
const area=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);if(Math.abs(area)<.001)continue;
const x0=Math.max(0,Math.floor(Math.min(a[0],b[0],c[0]))),x1=Math.min(w-1,Math.ceil(Math.max(a[0],b[0],c[0]))),y0=Math.max(0,Math.floor(Math.min(a[1],b[1],c[1]))),y1=Math.min(h-1,Math.ceil(Math.max(a[1],b[1],c[1])));

for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const px=x+.5,py=y+.5,u=((b[0]-px)*(c[1]-py)-(b[1]-py)*(c[0]-px))/area,v=((c[0]-px)*(a[1]-py)-(c[1]-py)*(a[0]-px))/area,t=1-u-v;if(u<-.00001||v<-.00001||t<-.00001)continue;const z=u*a[2]+v*b[2]+t*c[2],idx=y*w+x;if(z<depth[idx]){depth[idx]=z;pixels[idx*4]=rgb[0];pixels[idx*4+1]=rgb[1];pixels[idx*4+2]=rgb[2];pixels[idx*4+3]=255;}}
}ctx.putImageData(img,0,0)}
function render(){let w=canvas.clientWidth;canvas.style.height=Math.max(340,Math.min(520,w*.7))+'px';let h=canvas.clientHeight,d=gl?Math.min(devicePixelRatio||1,2):1;if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}
const mesh=model(),data=[];
for(let f of mesh){let a=f.v[1].map((v,i)=>v-f.v[0][i]),b=f.v[2].map((v,i)=>v-f.v[0][i]);let n=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],len=Math.hypot(...n)||1;
let shade=.74+.26*Math.abs((n[0]*-.3+n[1]*-.4+n[2]*.86)/len);let col=f.col;if(selected&&f.group!==selected&&f.group!=='base')col=col.map((v,i)=>v*.85+[235,234,220][i]*.15);col=col.map(c=>c*shade/255);

for(let i=1;i<ps.length-1;i++)for(let v of [ps[0],ps[i],ps[i+1]])data.push(...v,...col);
}
if(gl){gl.viewport(0,0,canvas.width,canvas.height);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(positionLocation);gl.vertexAttribPointer(positionLocation,3,gl.FLOAT,false,24,0);gl.enableVertexAttribArray(colorLocation);gl.vertexAttribPointer(colorLocation,3,gl.FLOAT,false,24,12);gl.drawArrays(gl.TRIANGLES,0,data.length/6);}else rasterDepth(data,canvas.width,canvas.height);
q('.step-label').textContent=progress<.03?'完整装配':progress<.32?'抬起炉壳与加热层':progress<.58?'揭开上半石英管':progress<.77?'分离密封端盖':'抽出晶舟';q('.view-label').textContent=progress<.03?'完整结构':'教学拆解 · 非运行状态';dirty=false;
}
function select(part){selected=part;touring=false;target={shell:.32,tube:.58,boat:1,gas:.77,outlet:.32}[part];if(reduced)progress=target;q('.tour').textContent='播放拆解';root.querySelectorAll('[data-part]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.part===part));q('.info strong').textContent=info[part][0];q('.info p').textContent=info[part][1];dirty=true}
root.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>select(b.dataset.part));q('#cvd-explode').oninput=e=>{touring=false;progress=target=+e.target.value/1000;q('.tour').textContent='播放拆解';dirty=true};q('.tour').onclick=()=>{touring=!touring;last=null;if(touring&&progress>.995)progress=target=0;q('.tour').textContent=touring?'暂停拆解':'播放拆解';dirty=true};q('.assemble').onclick=()=>{touring=false;target=0;if(reduced)progress=0;q('.tour').textContent='播放拆解';dirty=true};q('.reset').onclick=()=>{az=-.52;el=.46;zoom=1;dirty=true};q('.rotate').onclick=()=>{az+=.26;dirty=true};q('.rotate-right').onclick=()=>{az-=.26;dirty=true};q('.zoom-in').onclick=()=>{zoom=clamp(zoom*1.2,.65,1.8);dirty=true};q('.zoom-out').onclick=()=>{zoom=clamp(zoom/1.2,.65,1.8);dirty=true};
let pointers=new Map(),gesture=null;function begin(){let a=[...pointers.values()];gesture=a.length===1?{x:a[0].x,y:a[0].y,az,el}:a.length===2?{distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),zoom}:null}
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);begin()});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!gesture)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});let a=[...pointers.values()];if(a.length===1&&gesture.x!==undefined){az=gesture.az-(e.clientX-gesture.x)*.009;el=clamp(gesture.el+(e.clientY-gesture.y)*.005,.12,1.1)}else if(a.length===2&&gesture.distance){zoom=clamp(gesture.zoom*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/gesture.distance,.65,1.8)}dirty=true});for(let ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>{pointers.delete(e.pointerId);begin()});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();touring=false;q('.pose').textContent='三维绘制暂停，请重新打开此演示';});
